<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - VolunteerSync</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container" style="max-width: 500px; text-align: center; margin-top: 5rem;">
        <h1 class="page-title" style="margin-bottom: 1rem;">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:bottom; color:var(--primary)"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg> 
            VolunteerSync
        </h1>
        <p style="color:var(--text-light); margin-bottom: 2rem; font-size:1.1rem">Please authenticate into the ecosystem.</p>
        
        <div class="card" style="padding: 2.5rem; text-align:left;">
            <div style="display:flex; gap:1rem; margin-bottom:1.5rem; border-bottom: 2px solid rgba(255,255,255,0.08); padding-bottom:1rem;">
                <button id="tabAdmin" class="btn btn-full" style="margin:0; background:var(--primary); color:white; border:none; box-shadow:0 4px 14px 0 rgba(99, 102, 241, 0.35);">Admin Sign In</button>
                <button id="tabVol" class="btn btn-full" style="margin:0; background:rgba(255, 255, 255, 0.05); color:var(--text-light); border:1px solid rgba(255, 255, 255, 0.1); box-shadow:none">Volunteer Sign In</button>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" id="usernameLabel">Admin Username</label>
                    <input type="text" id="username" class="form-control" required placeholder="Enter username">
                </div>
                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                        <label class="form-label" style="margin-bottom:0;">Password</label>
                        <a href="#" id="linkForgotPassword" style="color:var(--text-light); font-size:0.85rem; text-decoration:none; font-weight:500;">Forgot Password?</a>
                    </div>
                    <input type="password" id="password" class="form-control" required placeholder="Enter password">
                </div>
                <button type="submit" class="btn btn-full">Sign In</button>
            </form>
            
            <div style="margin-top: 2rem; text-align: center; font-size:0.95rem;">
                Don't have an account? <br/>
                <a href="#" id="linkCreateAdmin" style="color:var(--primary); font-weight:600">Sign Up Admin</a> <span style="color:rgba(255,255,255,0.15); margin:0 0.5rem">|</span> 
                <a href="add-volunteer.html" style="color:var(--primary); font-weight:600">Sign Up Volunteer</a>
            </div>
        </div>
    </div>
    
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script>
        let currentRole = 'admin'; // admin or volunteer
        
        document.getElementById('tabAdmin').onclick = () => {
            currentRole = 'admin';
            document.getElementById('tabAdmin').style.background = 'var(--primary)';
            document.getElementById('tabAdmin').style.color = 'white';
            document.getElementById('tabAdmin').style.border = 'none';
            document.getElementById('tabAdmin').style.boxShadow = '0 4px 14px 0 rgba(99, 102, 241, 0.35)';

            document.getElementById('tabVol').style.background = 'rgba(255, 255, 255, 0.05)';
            document.getElementById('tabVol').style.color = 'var(--text-light)';
            document.getElementById('tabVol').style.border = '1px solid rgba(255, 255, 255, 0.1)';
            document.getElementById('tabVol').style.boxShadow = 'none';

            document.getElementById('usernameLabel').innerText = 'Admin Username';
        };
        
        document.getElementById('tabVol').onclick = () => {
            currentRole = 'volunteer';
            document.getElementById('tabVol').style.background = 'var(--primary)';
            document.getElementById('tabVol').style.color = 'white';
            document.getElementById('tabVol').style.border = 'none';
            document.getElementById('tabVol').style.boxShadow = '0 4px 14px 0 rgba(99, 102, 241, 0.35)';
            
            document.getElementById('tabAdmin').style.background = 'rgba(255, 255, 255, 0.05)';
            document.getElementById('tabAdmin').style.color = 'var(--text-light)';
            document.getElementById('tabAdmin').style.border = '1px solid rgba(255, 255, 255, 0.1)';
            document.getElementById('tabAdmin').style.boxShadow = 'none';

            document.getElementById('usernameLabel').innerText = 'Volunteer Username';
        };

        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            try {
                const res = await API.universalLogin(u, p, currentRole);
                Auth.setAuth(res.token, res.role);
                window.location.href = 'dashboard.html';
            } catch(e) { alert(e.message); }
        };

        document.getElementById('linkCreateAdmin').onclick = async (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if(!u || !p) return alert("Fill username and password fields to register your Admin quickly!");
            
            try {
                await API.registerAdmin(u, p);
                alert("Registered Admin Successfully! Click 'Sign In' to proceed.");
            } catch(e) { alert(e.message); }
        };

        // --- PASSWORD RECOVERY FLOW ---
        const recoverModal = document.getElementById('recoveryModalOverlay');
        const linkForgot = document.getElementById('linkForgotPassword');
        const btnCheckUser = document.getElementById('btnCheckUser');
        const btnResetPassword = document.getElementById('btnResetPassword');
        const btnCancelRecovery = document.getElementById('btnCancelRecovery');
        
        const step1 = document.getElementById('recoverStep1');
        const step2 = document.getElementById('recoverStep2');
        const recUsername = document.getElementById('recoverUsername');
        const recRole = document.getElementById('recoverRole');
        const recAnswer = document.getElementById('recoverAnswer');
        const recNewPassword = document.getElementById('recoverNewPassword');
        const recChallengeLabel = document.getElementById('recoverChallengeLabel');

        linkForgot.onclick = (e) => {
            e.preventDefault();
            recUsername.value = '';
            recAnswer.value = '';
            recNewPassword.value = '';
            step1.style.display = 'block';
            step2.style.display = 'none';
            recoverModal.classList.add('open');
        };

        btnCancelRecovery.onclick = () => {
            recoverModal.classList.remove('open');
        };

        btnCheckUser.onclick = async () => {
            const username = recUsername.value.trim();
            const role = recRole.value;
            if (!username) return alert("Please enter a username.");
            
            try {
                const res = await API.recoverInit(username, role);
                recChallengeLabel.innerText = res.prompt;
                recAnswer.placeholder = role === 'admin' ? 'e.g. admin@volunteersync.local' : 'e.g. 555-0101';
                step1.style.display = 'none';
                step2.style.display = 'block';
            } catch (err) {
                alert(err.message);
            }
        };

        btnResetPassword.onclick = async () => {
            const username = recUsername.value.trim();
            const role = recRole.value;
            const answer = recAnswer.value.trim();
            const newPassword = recNewPassword.value.trim();
            if (!answer || !newPassword) return alert("Please fill in both the verification answer and your new password.");

            try {
                await API.recoverReset(username, role, answer, newPassword);
                alert("Password reset successful! You can now sign in with your new password.");
                recoverModal.classList.remove('open');
                
                // Pre-fill main form
                document.getElementById('username').value = username;
                document.getElementById('password').value = newPassword;
                // Switch login role tabs if needed
                if (role === 'admin') {
                    document.getElementById('tabAdmin').click();
                } else {
                    document.getElementById('tabVol').click();
                }
            } catch (err) {
                alert(err.message);
            }
        };
    </script>

    <!-- Password Recovery Modal Overlay -->
    <div id="recoveryModalOverlay" class="modal-overlay">
        <div class="review-modal-content" style="width: 450px;">
            <h2 style="font-family:'Outfit'; margin-bottom: 0.5rem; text-align: center;">Reset Account Password</h2>
            <p style="color:var(--text-light); text-align:center; font-size:0.9rem; margin-bottom: 1.5rem;">Verify registered contact information to recovery your profile.</p>
            
            <form id="recoveryForm" onsubmit="event.preventDefault();">
                <!-- Step 1: Username & Role -->
                <div id="recoverStep1">
                    <div class="form-group">
                        <label class="form-label">Username</label>
                        <input type="text" id="recoverUsername" class="form-control" required placeholder="Enter your username">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Account Type / Role</label>
                        <select id="recoverRole" class="form-control" style="margin-bottom: 1.5rem;">
                            <option value="volunteer">Volunteer</option>
                            <option value="admin">Administrator</option>
                        </select>
                    </div>
                    <button type="button" id="btnCheckUser" class="btn btn-full">Verify Username</button>
                </div>

                <!-- Step 2: Verification Challenge & Password -->
                <div id="recoverStep2" style="display: none;">
                    <div class="form-group">
                        <label class="form-label" id="recoverChallengeLabel">Verification Challenge</label>
                        <input type="text" id="recoverAnswer" class="form-control" placeholder="Enter answer">
                    </div>
                    <div class="form-group">
                        <label class="form-label">New Password</label>
                        <input type="password" id="recoverNewPassword" class="form-control" placeholder="Enter new password">
                    </div>
                    <button type="button" id="btnResetPassword" class="btn btn-full">Reset Password</button>
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                    <button type="button" id="btnCancelRecovery" class="btn btn-full" style="margin-top:0; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color:var(--text-main); box-shadow:none;">Cancel</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
