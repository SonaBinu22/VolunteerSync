<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - VolunteerSync</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            VolunteerSync
        </a>
        <div class="nav-links">
            <!-- Dynamically injected via auth.js -->
        </div>
    </nav>
    <div class="container">
        <h1 class="page-title" style="text-align: center;">Volunteer Profile Setup</h1>
        
        <div class="form-card" id="profileWrapper" style="display:none;">
            <form id="profileForm" class="form-grid">
                <div class="form-group full-width" style="text-align:center; border-bottom: 2px solid rgba(255,255,255,0.08); padding-bottom:1.5rem; margin-bottom:1.5rem; display:flex; flex-direction:column; align-items:center; gap:0.75rem;">
                    <img id="displayAvatar" src="" style="width:90px; height:90px; border-radius:50%; object-fit:cover; border:3px solid rgba(255,255,255,0.15); box-shadow: 0 4px 10px rgba(0,0,0,0.3)">
                    <h3 style="color:var(--text-main); font-family:'Outfit'">Account: <span id="displayUsername" style="color:var(--primary)"></span></h3>
                    <div style="margin-top:0.25rem; display:flex; flex-direction:column; align-items:center; gap:0.25rem;">
                        <div style="display:flex; align-items:center; gap:6px;">
                            <span style="color:#f59e0b; font-weight:700;" id="profileAvgRating">⭐ 5.0</span>
                            <span style="font-size:0.75rem; color:var(--text-light)" id="profileReviewCount">(0 reviews)</span>
                        </div>
                        <div id="profileBadges" style="display:flex; flex-wrap:wrap; justify-content:center; gap:4px; margin-top:0.25rem;"></div>
                    </div>
                </div>

                <div class="form-group full-width">
                    <label class="form-label" for="vName">Full Name *</label>
                    <input type="text" id="vName" class="form-control" required placeholder="e.g. Jane Doe">
                </div>

                <div class="form-group">
                    <label class="form-label" for="vGender">Gender</label>
                    <select id="vGender" class="form-control">
                        <option value="">Select...</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other / Prefer not to say</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="vBlood">Blood Group</label>
                    <select id="vBlood" class="form-control">
                        <option value="">Select...</option>
                        <option value="A+">A+</option><option value="A-">A-</option>
                        <option value="B+">B+</option><option value="B-">B-</option>
                        <option value="AB+">AB+</option><option value="AB-">AB-</option>
                        <option value="O+">O+</option><option value="O-">O-</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label class="form-label" for="vAddress">Home Address</label>
                    <input type="text" id="vAddress" class="form-control" placeholder="e.g. 123 Main St, Springfield">
                </div>

                <div class="form-group">
                    <label class="form-label" for="vLocation">Current Location / Neighborhood *</label>
                    <input type="text" id="vLocation" class="form-control" placeholder="e.g. Downtown" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="vPhone">Phone Number</label>
                    <input type="tel" id="vPhone" class="form-control" placeholder="e.g. (555) 123-4567">
                </div>

                <div class="form-group full-width">
                    <label class="form-label">Profile Picture (Drag & Drop or click to upload)</label>
                    <div id="dropZone" style="border: 2px dashed rgba(255, 255, 255, 0.15); border-radius: 10px; padding: 1.5rem; text-align: center; background: rgba(15, 23, 42, 0.4); cursor: pointer; transition: all 0.3s ease;">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:0.5rem; filter: drop-shadow(0 0 4px rgba(99,102,241,0.4))"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                        <div id="uploadStatus" style="font-size: 0.9rem; color: var(--text-light); font-weight: 500;">Select an image file, or drag it here</div>
                        <input type="file" id="v_file" accept="image/*" style="display: none;">
                        <input type="hidden" id="v_pic">
                    </div>
                </div>

                <div class="form-group full-width">
                    <label class="form-label" for="vSkills">Skills (comma separated) *</label>
                    <input type="text" id="vSkills" class="form-control" required placeholder="e.g. Nursing, Driving, Cooking">
                </div>

                <div class="form-group full-width">
                    <label class="form-label" for="vAvailability">Availability *</label>
                    <input type="text" id="vAvailability" class="form-control" required placeholder="e.g. Weekends, Evenings">
                </div>

                <div class="form-group full-width" style="border-top:2px solid rgba(255,255,255,0.08); padding-top:1.5rem; margin-top:1rem;">
                    <h3 style="font-family:'Outfit'; color:var(--primary); margin-bottom:1rem">My Reviews & Feedback</h3>
                    <div id="myReviewsList" style="display:flex; flex-direction:column; gap:0.75rem; max-height: 250px; overflow-y: auto; padding-right: 0.5rem;">
                        <p style="color:var(--text-light); font-size:0.9rem; font-style:italic">No reviews submitted yet.</p>
                    </div>
                </div>

                <div class="full-width" style="display:flex; gap:1rem; margin-top:1rem;">
                    <button type="submit" class="btn btn-full">Save Changes</button>
                    <button type="button" onclick="Auth.logout()" class="btn btn-full" style="background-color: #ef4444; color:white; border:none; box-shadow:none;">Logout Account</button>
                </div>
            </form>
        </div>

        <div id="unauthMessage" style="text-align:center; padding: 2.5rem; display:none;">
             <h2 style="margin-bottom:1rem;">Access Restricted</h2>
             <p style="color:var(--text-light)">Please <a href="index.html" style="color:var(--primary); font-weight:600">login as a volunteer</a> to configure your profile details.</p>
        </div>
    </div>
    
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('v_file');
        const picHidden = document.getElementById('v_pic');
        const uploadStatus = document.getElementById('uploadStatus');

        dropZone.onclick = () => fileInput.click();

        dropZone.ondragover = (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'var(--primary)';
            dropZone.style.background = 'rgba(99, 102, 241, 0.08)';
        };

        dropZone.ondragleave = () => {
            dropZone.style.borderColor = 'rgba(255, 255, 255, 0.15)';
            dropZone.style.background = 'rgba(15, 23, 42, 0.4)';
        };

        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'rgba(255, 255, 255, 0.15)';
            dropZone.style.background = 'rgba(15, 23, 42, 0.4)';
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        };

        fileInput.onchange = () => {
            if (fileInput.files.length > 0) {
                handleFile(fileInput.files[0]);
            }
        };

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                return alert('Please select an image file.');
            }
            const reader = new FileReader();
            reader.onload = (e) => {
                picHidden.value = e.target.result;
                uploadStatus.innerHTML = `✅ <strong>${file.name}</strong> uploaded successfully!`;
                uploadStatus.style.color = '#10b981';
            };
            reader.readAsDataURL(file);
        }

        function getVolunteerRatingInfo(volunteer) {
            const reviews = (volunteer && volunteer.reviews) || [];
            if (reviews.length === 0) return { avg: "5.0", count: 0, stars: "⭐⭐⭐⭐⭐" };
            
            const sum = reviews.reduce((acc, r) => acc + r.rating, 0);
            const avg = (sum / reviews.length).toFixed(1);
            const rounded = Math.round(sum / reviews.length);
            const stars = "⭐".repeat(rounded) + "☆".repeat(5 - rounded);
            return { avg, count: reviews.length, stars };
        }

        function getVolunteerBadges(volunteer, needsCount) {
            const list = [];
            const skillsLower = ((volunteer && volunteer.skills) || '').toLowerCase();
            
            if (needsCount > 0) {
                list.push({ label: "Helper", class: "badge-helper" });
            }
            
            const ratingInfo = getVolunteerRatingInfo(volunteer);
            if (needsCount >= 3 || (ratingInfo.count >= 2 && parseFloat(ratingInfo.avg) >= 4.7)) {
                list.push({ label: "Community Hero", class: "badge-hero" });
            }
            
            if (skillsLower.includes("nurse") || skillsLower.includes("first aid") || skillsLower.includes("medical")) {
                list.push({ label: "Medical Shield", class: "badge-medical" });
            }
            
            if (skillsLower.includes("driver") || skillsLower.includes("lifting") || skillsLower.includes("driving") || skillsLower.includes("stamina")) {
                list.push({ label: "Logistics Specialist", class: "badge-logistics" });
            }
            
            return list;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            if (!Auth.isVolunteer()) {
                document.getElementById('profileWrapper').style.display = 'none';
                document.getElementById('unauthMessage').style.display = 'block';
                return;
            }
            document.getElementById('profileWrapper').style.display = 'block';
            document.getElementById('unauthMessage').style.display = 'none';
            try {
                const [profile, needs] = await Promise.all([
                    API.getVolunteerProfile(),
                    API.getNeeds()
                ]);
                
                document.getElementById('displayAvatar').src = profile.profilePic || `https://ui-avatars.com/api/?name=${encodeURIComponent(profile.name)}&background=random`;
                document.getElementById('displayUsername').innerText = profile.username;
                document.getElementById('vName').value = profile.name || '';
                document.getElementById('vGender').value = profile.gender || '';
                document.getElementById('vBlood').value = profile.bloodGroup || '';
                document.getElementById('vAddress').value = profile.address || '';
                document.getElementById('vLocation').value = profile.currentLocation || '';
                document.getElementById('vPhone').value = profile.phone || '';
                
                picHidden.value = profile.profilePic || '';
                if (profile.profilePic) {
                    uploadStatus.innerHTML = `✅ <strong>Profile Photo</strong> loaded successfully!`;
                    uploadStatus.style.color = '#10b981';
                }
                
                document.getElementById('vSkills').value = profile.skills || '';
                document.getElementById('vAvailability').value = profile.availability || '';
                
                // Render rating stats
                const ratingInfo = getVolunteerRatingInfo(profile);
                document.getElementById('profileAvgRating').innerText = `⭐ ${ratingInfo.avg}`;
                document.getElementById('profileReviewCount').innerText = `(${ratingInfo.count} reviews)`;
                
                // Render badges
                const completedTasksCount = needs.filter(n => 
                    (n.status === 'completed' || n.status === 'matched') && 
                    n.assignedVolunteers && 
                    n.assignedVolunteers.some(av => av.id === profile.id)
                ).length;
                const badges = getVolunteerBadges(profile, completedTasksCount);
                const badgesDiv = document.getElementById('profileBadges');
                if (badges.length > 0) {
                    badgesDiv.innerHTML = badges.map(b => `<span class="badge ${b.class}" style="font-size:0.7rem; padding: 2px 8px;">${b.label}</span>`).join('');
                } else {
                    badgesDiv.innerHTML = '<span style="font-size:0.75rem; color:var(--text-light); font-style:italic">No badges earned yet</span>';
                }

                // Render reviews list
                const reviewsListDiv = document.getElementById('myReviewsList');
                if (profile.reviews && profile.reviews.length > 0) {
                    reviewsListDiv.innerHTML = profile.reviews.map(r => `
                        <div style="background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.05); padding:0.75rem 1rem; border-radius:10px;">
                            <div style="display:flex; justify-content:space-between; margin-bottom:0.25rem;">
                                <span style="font-weight:600; color:var(--text-main)">Reviewed by Admin: ${r.reviewer}</span>
                                <span style="color:#f59e0b; font-weight:700;">⭐ ${r.rating}.0</span>
                            </div>
                            <p style="color:var(--text-light); font-size:0.9rem; line-height:1.4;">${r.comment || '<span style="font-style:italic">No comments left</span>'}</p>
                            <span style="font-size:0.75rem; color:var(--text-light); display:block; margin-top:0.25rem;">🕒 ${new Date(r.timestamp).toLocaleDateString()}</span>
                        </div>
                    `).join('');
                } else {
                    reviewsListDiv.innerHTML = '<p style="color:var(--text-light); font-size:0.9rem; font-style:italic">No reviews submitted yet.</p>';
                }
                
            } catch(e) { console.error(e); }
        });

        document.getElementById('profileForm').addEventListener('submit', async (e) => {
             e.preventDefault();
             try {
                 const updated = await API.updateVolunteerProfile({
                     name: document.getElementById('vName').value,
                     gender: document.getElementById('vGender').value,
                     bloodGroup: document.getElementById('vBlood').value,
                     address: document.getElementById('vAddress').value,
                     currentLocation: document.getElementById('vLocation').value,
                     phone: document.getElementById('vPhone').value,
                     profilePic: document.getElementById('v_pic').value,
                     skills: document.getElementById('vSkills').value,
                     availability: document.getElementById('vAvailability').value
                 });
                 // Live update avatar preview
                 document.getElementById('displayAvatar').src = updated.profilePic || `https://ui-avatars.com/api/?name=${encodeURIComponent(updated.name)}&background=random`;
                 alert('Volunteer Profile Saved Successfully!');
                 window.location.href = "dashboard.html";
             } catch(e) { alert(e.message); }
        });
    </script>
</body>
</html>
